<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>DORAFA Tropical Brasil - Cardápio</title>
    <style>
        :root {
            color-scheme: light;
        }

        html, body {
            color-scheme: light;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(#d9f3a2, #f6e27f);
            background-color: #d9f3a2;
            color: #0a5c2f;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: light;
            }

            html, body {
                color-scheme: light;
            }

            body {
                background: linear-gradient(#d9f3a2, #f6e27f);
                background-color: #d9f3a2;
                color: #0a5c2f;
            }
        }

        :root {
            --verde: #0a5c2f;
            --amarelo: #fefecf;
            --price-w: 96px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            color: #0a5c2f;
            font-weight: bold;
        }

        #pdvLabel {
            display: none;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 48px;
        }

        .brand img {
            height: 48px;
            max-width: 180px;
            object-fit: contain;
            display: none;
        }

        .search-bar {
            margin: 10px auto;
            width: 92%;
        }

        .search-bar input {
            width: 94%;
            padding: 10px;
            font-size: 14px;
            border-radius: 20px;
            border: none;
        }

        .banner {
            margin: 20px auto;
            width: 92%;
            height: 200px;
            background: #fefecf;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            overflow: hidden;
        }

        .banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .section-title {
            background: #0a5c2f;
            color: white;
            padding: 10px;
            text-align: center;
            width: 87%;
            border-radius: 20px;
            margin: 0 auto;
        }

        .cards {
            display: flex;
            justify-content: space-around;
            padding: 20px 0;
            width: 88%;
            margin: 0 auto;
            flex-wrap: wrap;
        }

        .card {
            background: #fefecf;
            border-radius: 20px;
            width: 220px;
            height: 220px;
            padding: 15px;
            text-align: center;
            margin: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card img {
            width: 100%;
            border-radius: 15px;
        }

        .price-btn {
            margin-top: 10px;
            background: #0a5c2f;
            color: white;
            padding: 10px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .product-price {
            margin-top: 8px;
            font-weight: 900;
            color: var(--verde);
            opacity: 0.92;
        }

        .price-btn[aria-disabled="true"],
        .add-btn[aria-disabled="true"] {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .product-list {
            width: 92%;
            margin: 0 auto;
        }

        .product {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            background: #fefecf;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 15px;
            position: relative;
        }

        .product img {
            width: 80px;
            border-radius: 10px;
            align-self: center;
        }

        .product-info {
            flex: 1;
            margin-left: 15px;
            min-width: 0;
            padding-right: calc(var(--price-w) + 12px);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .product-title {
            font-weight: bold;
            display: block;
            margin-top: -2px;
            line-height: 1.15;
            white-space: nowrap;
            overflow: visible;
            text-overflow: clip;
            margin-right: calc(-1 * (var(--price-w) + 12px));
        }

        .product-desc {
            margin-top: 12px;
            opacity: 0.9;
            line-height: 1.2;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .product-desc-btn {
            margin-top: 10px;
            margin-right: 10px;
            background: rgba(10, 92, 47, 0.08);
            border: 1px solid rgba(10, 92, 47, 0.35);
            color: var(--verde);
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            cursor: pointer;
            align-self: flex-start;
        }

        button.product-desc-btn {
            margin-top: 10px;
            margin-right: 10px;
            background: rgba(10, 92, 47, 0.08);
            border: 1px solid rgba(10, 92, 47, 0.35);
            color: var(--verde);
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            cursor: pointer;
            align-self: flex-start;
        }

        .product-desc.product-desc-clamp {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            overflow: hidden;
        }

        .card-title {
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .add-btn {
            background: #0a5c2f;
            color: white;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            white-space: nowrap;
            width: var(--price-w);
            text-align: center;
            flex: 0 0 auto;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
        }

        .add-btn,
        .price-btn {
            border: none;
            outline: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .add-btn:active,
        .price-btn:active {
            transform: translateY(-50%) scale(0.98);
        }

        footer {
            display: flex;
            justify-content: space-between;
            padding: 20px;
        }

        .floating-actions {
            position: fixed;
            left: 14px;
            right: 14px;
            bottom: 14px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            z-index: 998;
            pointer-events: none;
        }

        .floating-actions button {
            pointer-events: auto;
            flex: 1 1 0;
            max-width: 240px;
            padding: 14px 18px;
            border-radius: 18px;
            font-weight: 900;
            box-shadow: 0 10px 24px rgba(0,0,0,0.18);
        }

        button {
            background: #0a5c2f;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #comprovanteFile::file-selector-button {
            background: #f0b429;
            color: #1d1d1d;
            border: none;
            border-radius: 12px;
            padding: 12px 14px;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
        }

        #comprovanteFile::-webkit-file-upload-button {
            background: #f0b429;
            color: #1d1d1d;
            border: none;
            border-radius: 12px;
            padding: 12px 14px;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
        }

        #comprovanteFile {
            width: 100%;
            font-size: 15px;
            padding: 6px 0;
        }

        .btn-comprovante {
            width: 100%;
            padding: 16px 18px;
            border-radius: 18px;
            font-size: 18px;
            font-weight: 900;
            background: #2f9e44;
            color: white;
        }

        .pill {
            background: var(--amarelo);
            border: 1px solid rgba(10, 92, 47, 0.35);
            color: var(--verde);
            border-radius: 999px;
            padding: 8px 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .pill.active {
            background: var(--verde);
            color: white;
        }

        .toolbar {
            width: 90%;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .category-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        #categoriasRow {
            display: flex;
        }

        #categoriasRow button:not(:first-child) {
            display: none;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 999;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .modal {
            width: min(720px, 100%);
            background: var(--amarelo);
            border-radius: 18px;
            border: 2px solid rgba(10, 92, 47, 0.35);
            padding: 16px;
            max-height: calc(100vh - 32px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal.status-pendente {
            background: #cfe2ff;
            border-color: #0d6efd;
        }

        .modal.status-em-atendimento {
            background: #fff3cd;
            border-color: #f0b429;
        }

        .modal.status-respondida {
            background: #d4edda;
            border-color: #2f9e44;
        }

        .modal.status-rejeitada {
            background: #f8d7da;
            border-color: #e03131;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        #modalBody {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            max-height: calc(100vh - 140px);
            flex: 1;
            min-height: 0;
        }

        .modal-title {
            font-weight: bold;
            color: var(--verde);
            font-size: 18px;
        }

        .modal-close {
            background: transparent;
            color: var(--verde);
            border: 1px solid rgba(10, 92, 47, 0.35);
            border-radius: 12px;
            padding: 8px 10px;
        }

        .cart-row {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 10px;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(10, 92, 47, 0.2);
        }

        .qty {
            display: inline-flex;
            gap: 8px;
            align-items: center;
        }

        .qty button {
            padding: 8px 12px;
            border-radius: 12px;
        }

        .muted {
            opacity: 0.75;
        }

        .status {
            font-weight: bold;
        }

        #whatsFloat {
            position: fixed;
            right: 16px;
            bottom: calc(86px + env(safe-area-inset-bottom));
            z-index: 998;
            display: none;
            align-items: center;
            gap: 10px;
            padding: 0;
            border-radius: 999px;
            text-decoration: none;
            color: white;
            background: #25D366;
            box-shadow: 0 10px 24px rgba(0,0,0,0.22);
            font-weight: 800;
            width: 56px;
            height: 56px;
            justify-content: center;
        }

        #whatsFloat svg {
            width: 22px;
            height: 22px;
            display: block;
            fill: currentColor;
            color: white;
        }

        #whatsFloat div { display: none; }

        @media (max-width: 480px) {
            header {
                padding: 12px 16px;
            }

            #whatsFloat {
                bottom: calc(76px + env(safe-area-inset-bottom));
            }

            .modal-backdrop {
                align-items: flex-start;
            }

            :root {
                --price-w: 92px;
            }

            .product-info {
                padding-right: calc(var(--price-w) + 22px);
            }

            .search-bar {
                width: 92%;
            }

            .search-bar input {
                padding: 12px;
                font-size: 16px;
            }

            .banner {
                width: 92%;
                height: 160px;
                font-size: 28px;
            }

            .cards {
                padding: 12px;
                gap: 4px;
                justify-content: center;
                flex-wrap: nowrap;
                overflow-x: hidden;
            }

            .card {
                width: calc((100% - 10px) / 3);
                height: calc((100vw - 10px) / 3);
                flex: 0 0 auto;
                margin: 0;
                padding: 3px;
                border-radius: 13px;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }

            .card img {
                width: 100%;
                flex: 1 1 auto;
                min-height: 0;
                object-fit: cover;
                border-radius: 9px;
            }

            .card p {
                margin: 2px 0 0;
                font-size: 8px;
                line-height: 1;
            }

            .price-btn {
                margin-top: 2px;
                flex: 1;
                min-height: 0;
            }

            .modal-title {
                font-weight: bold;
                color: var(--verde);
                font-size: 18px;
            }
            .product-list {
                width: 92%;
            }

            .product {
                gap: 10px;
            }
        }
    </style>
</head>

<body>

<header>
    <div id="pdvLabel">PDV: 001</div>
    <div class="brand" onclick="location.reload()">
        <img id="logoImg" alt="Logo">
        <div id="brandText">DORAFÁ Tropical Brasil</div>
    </div>
    <a id="whatsBtn" href="#" target="_blank" rel="noopener" style="display:none; text-decoration:none; color:inherit; font-weight:bold">WhatsApp</a>
    <div style="cursor:pointer" onclick="abrirCarrinho()">🛒 <span id="cartCount">0</span></div>
</header>

<a id="whatsFloat" href="#" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 2a9.94 9.94 0 0 0-8.53 15.02L2 22l5.1-1.35A9.96 9.96 0 0 0 12 22a10 10 0 0 0 0-20Zm5.77 14.42c-.24.67-1.21 1.23-1.97 1.39-.52.11-1.2.2-3.48-.74-2.91-1.2-4.79-4.14-4.93-4.33-.14-.19-1.18-1.57-1.18-2.99 0-1.42.74-2.12 1.01-2.41.26-.29.57-.36.76-.36h.55c.17 0 .41-.06.64.49.24.58.82 2 .89 2.14.07.14.11.32.02.51-.09.2-.14.32-.28.49-.14.17-.29.38-.42.51-.14.14-.28.29-.12.58.16.29.7 1.16 1.5 1.88 1.03.92 1.9 1.2 2.19 1.34.29.14.45.12.62-.07.17-.19.71-.82.9-1.1.19-.28.38-.24.64-.14.26.1 1.65.78 1.93.92.29.14.48.22.55.34.07.12.07.68-.17 1.35Z" />

<div class="search-bar">
    <input type="text" id="search" placeholder="Busque pelo seu produto favorito" onkeyup="filtrarProdutos()">
</div>

<div class="banner" id="banner">
    <img id="bannerImg" alt="Banner">
    <div id="bannerFallback">BANNER INTERATIVO</div>
</div>

<div class="section-title">QUERIDINHOS</div>

<div class="cards" id="queridinhos"></div>

<div id="closedPanel" style="display:none; width:92%; margin: 14px auto; background: rgba(254, 254, 207, 0.92); border: 2px solid rgba(10, 92, 47, 0.35); border-radius: 20px; padding: 16px; box-sizing: border-box;">
    <div style="font-weight:900; font-size:18px">Estamos fechados agora</div>
    <div class="muted" id="closedMessage" style="margin-top:8px"></div>
    <div class="muted" id="closedNext" style="margin-top:10px"></div>
    <div class="muted" id="closedLocalTime" style="margin-top:10px"></div>
</div>

<div class="toolbar">
    <div class="category-row" id="categoriasRow"></div>

</div>

        <button type="button" onclick="voltarAoCardapio()">Voltar</button>

    <button onclick="abrirCategorias()">Categorias</button>

    <div class="modal" id="modalBox">
        <div class="modal-header">
            <div class="modal-title" id="modalTitle">Carrinho</div>
            <button class="modal-close" onclick="fecharModal()">Fechar</button>
        </div>
        <div id="modalBody"></div>
    </div>
</div>

<script>
    const STORAGE_KEYS = {
        carrinho: "cardapio.cart.v1",
        pedido: "cardapio.lastPedido.v1",
        payMethod: "cardapio.payMethod.v1",
        clientName: "cardapio.clientName.v1",
        clientWhatsapp: "cardapio.clientWhatsapp.v1",
        deliveryType: "cardapio.deliveryType.v1",
        deliveryRua: "cardapio.deliveryRua.v1",
        deliveryNumero: "cardapio.deliveryNumero.v1",
        deliveryBairro: "cardapio.deliveryBairro.v1",
        deliveryCidade: "cardapio.deliveryCidade.v1",
        deliveryRef: "cardapio.deliveryRef.v1",
        deliveryTroco: "cardapio.deliveryTroco.v1",
        deliveryObs: "cardapio.deliveryObs.v1",
        mesa: "cardapio.mesa.v1",
        token: "cardapio.token.v1"
    };

    function _safeJsonParse(s) {
        try {
            return JSON.parse(String(s || "") || "{}");
        } catch {
            return null;
        }
    }

    function _parseHm(hm) {
        const m = String(hm || "").trim().match(/^(\d{1,2}):(\d{2})$/);
        if (!m) return null;
        const hh = Number(m[1]);
        const mm = Number(m[2]);
        if (!Number.isFinite(hh) || !Number.isFinite(mm)) return null;
        if (hh < 0 || hh > 23 || mm < 0 || mm > 59) return null;
        return hh * 60 + mm;
    }

    function _weekdayKeyInTz(tz) {
        const d = new Date();
        const parts = new Intl.DateTimeFormat("en-US", { weekday: "short", timeZone: tz }).format(d);
        const map = { Mon: "mon", Tue: "tue", Wed: "wed", Thu: "thu", Fri: "fri", Sat: "sat", Sun: "sun" };
        return map[String(parts)] || "mon";
    }

    function _timeMinutesInTz(tz) {
        const d = new Date();
        const fmt = new Intl.DateTimeFormat("en-US", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: tz });
        const out = fmt.format(d);
        const m = String(out).match(/^(\d{2}):(\d{2})$/);
        if (!m) return null;
        const hh = Number(m[1]);
        const mm = Number(m[2]);
        if (!Number.isFinite(hh) || !Number.isFinite(mm)) return null;
        return hh * 60 + mm;
    }

    function _humanTzNow(tz) {
        try {
            return new Intl.DateTimeFormat("pt-BR", {
                timeZone: tz,
                weekday: "long",
                hour: "2-digit",
                minute: "2-digit",
            }).format(new Date());
        } catch {
            return "";
        }
    }

    function _calcOpenStateFromHorario(horario) {
        const mode = String(horario?.mode || "AUTO").trim().toUpperCase();
        const tz = String(horario?.tz || "America/Sao_Paulo").trim() || "America/Sao_Paulo";
        const closedMessage = String(horario?.closedMessage || "Estamos fechados no momento.").trim();

        if (mode === "ABERTO") {
            return { isOpen: true, reason: "override_open", tz, closedMessage, nextOpen: null, nowLabel: _humanTzNow(tz) };
        }
        if (mode === "FECHADO") {
            return { isOpen: false, reason: "override_closed", tz, closedMessage, nextOpen: null, nowLabel: _humanTzNow(tz) };
        }

        const hoursRaw = String(horario?.hours || "").trim();
        const hours = hoursRaw ? _safeJsonParse(hoursRaw) : null;
        if (!hours || typeof hours !== "object") {
            return { isOpen: true, reason: "no_hours", tz, closedMessage, nextOpen: null, nowLabel: _humanTzNow(tz) };
        }

        const dayKey = _weekdayKeyInTz(tz);
        const windows = Array.isArray(hours[dayKey]) ? hours[dayKey] : [];
        const nowMin = _timeMinutesInTz(tz);
        if (nowMin === null) {
            return { isOpen: true, reason: "tz_parse_fail", tz, closedMessage, nextOpen: null, nowLabel: _humanTzNow(tz) };
        }

        let openNow = false;
        let nextOpenMin = null;
        for (const w of windows) {
            const s = String(w || "").trim();
            const mm = s.match(/^(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})$/);
            if (!mm) continue;
            const a = _parseHm(mm[1]);
            const b = _parseHm(mm[2]);
            if (a === null || b === null) continue;
            if (nowMin >= a && nowMin <= b) {
                openNow = true;
            }
            if (nowMin < a) {
                if (nextOpenMin === null || a < nextOpenMin) nextOpenMin = a;
            }
        }

        let nextOpen = null;
        if (!openNow && nextOpenMin !== null) {
            const hh = String(Math.floor(nextOpenMin / 60)).padStart(2, "0");
            const mi = String(nextOpenMin % 60).padStart(2, "0");
            nextOpen = `${hh}:${mi}`;
        }

        return {
            isOpen: openNow,
            reason: openNow ? "in_window" : "out_window",
            tz,
            closedMessage,
            nextOpen,
            nowLabel: _humanTzNow(tz)
        };
    }

    function aplicarHorarioFuncionamento() {
        const horario = state.data?.ui?.horario;
        const info = _calcOpenStateFromHorario(horario);
        const panel = document.getElementById("closedPanel");
        const msg = document.getElementById("closedMessage");
        const next = document.getElementById("closedNext");
        const now = document.getElementById("closedLocalTime");

        const shouldBlock = !info.isOpen;
        if (panel) panel.style.display = shouldBlock ? "block" : "none";
        if (msg) msg.innerText = info.closedMessage || "";
        if (next) next.innerText = info.nextOpen ? `Próxima abertura hoje: ${info.nextOpen}` : "";

        const token = tokenRaw ? String(tokenRaw) : null;
        if (!mesa || !Number.isFinite(mesa) || mesa <= 0) return { mesa: null, token: null };
        if (!token || token.length < 10) return { mesa, token: null };
        return { mesa, token };
    }

    async function uploadComprovante() {
        const pedido = getPedidoAtual();
        if (!pedido || !pedido.id) return;
        if (!state.mesa || !state.token) return;

        const inputFile = document.getElementById("comprovanteFile");
        const file = (inputFile && inputFile.files && inputFile.files.length > 0) ? inputFile.files[0] : null;

        if (!file) {
            setModal("Comprovante", `<div><strong>Selecione o PRINT (captura de tela) do comprovante (ou um PDF).</strong></div><div class="muted" style="margin-top:8px">No app do banco: abra o comprovante, faça um print (captura de tela) e depois volte aqui para selecionar o print na galeria. Se preferir, você também pode enviar o comprovante em PDF.</div>`);
            abrirModal();
            return;
        }

        const form = new FormData();
        form.append("file", file);

        try {
            const url = `/api/solicitacoes/${encodeURIComponent(pedido.id)}/comprovante?mesa=${encodeURIComponent(state.mesa)}&token=${encodeURIComponent(state.token)}`;
            const res = await fetch(url, { method: "POST", body: form });
            if (!res.ok) {
                let j = {};
                try { j = await res.json(); } catch {}

                const err = String(j.error || res.status || "");
                let msg = err;
                if (err === "extensao_nao_permitida") {
                    msg = "Formato não permitido. Envie PDF ou foto (JPG/PNG).";
                } else if (err === "arquivo_invalido" || err === "arquivo_nao_enviado") {
                    msg = "Arquivo inválido. Tente tirar uma foto do comprovante.";
                } else if (err === "comprovante_indisponivel") {
                    msg = "Comprovante disponível apenas quando o pedido for respondido como PIX.";
                }

                setModal("Comprovante", `<div><strong>Falha ao enviar comprovante:</strong> ${msg}</div>`);
                abrirModal();
                return;
            }
        } catch {
            setModal("Comprovante", `<div><strong>Falha ao enviar comprovante.</strong></div>`);
            abrirModal();
            return;
        }

        setModal("Comprovante", `<div><strong>Comprovante enviado com sucesso.</strong></div><div class="muted" style="margin-top:8px">Aguarde o operador confirmar o pagamento.</div>`);
        abrirModal();
        await refreshSolicitacao();
    }

    function addCarrinho(produtoId) {
        const pid = String(produtoId || "").trim();
        if (!pid) return;

        const produtos = Array.isArray(state.data?.produtos) ? state.data.produtos : [];
        const p = produtos.find(x => String(x?.id || "") === pid);
        if (!p) return;

        const idx = state.carrinho.findIndex(x => String(x.produtoId) === pid);
        if (idx >= 0) {
            state.carrinho[idx].qtd += 1;
        } else {
            state.carrinho.push({
                produtoId: pid,
                nome: String(p.nome || ""),
                preco: Number(p.preco || 0),
                qtd: 1,
            });
        }

        saveLocal();
        updateCartBadge();
    }

    function alterarQtd(produtoId, delta) {
        const idx = state.carrinho.findIndex(x => x.produtoId === produtoId);
        if (idx < 0) return;
        state.carrinho[idx].qtd += delta;
        if (state.carrinho[idx].qtd <= 0) state.carrinho.splice(idx, 1);
        saveLocal();
        updateCartBadge();

    function getPedidoAtual() {
        try {
            const raw = localStorage.getItem(STORAGE_KEYS.pedido);
            const p = raw ? JSON.parse(raw) : null;
            if (!p || !p.id) return null;
            const kind = String(p.kind || "").toUpperCase();
            // Evita reaproveitar pedido antigo de outra mesa/token
            if (kind !== "DELIVERY") {
                if (state.mesa && String(p.mesa || "") !== String(state.mesa)) return null;
                if (state.token && String(p.token || "") !== String(state.token)) return null;
            }
            // Compatibilidade: versões antigas salvavam status "ENVIADO"
            if (String(p.status || "").toUpperCase() === "ENVIADO") {
                p.status = "PENDENTE";
            }

            // Expira pedidos muito antigos para não aparecerem como "pedido atual" para sempre
            // (o carrinho é um dispositivo de mesa; pedido antigo não deve ficar meses visível).
            try {
                const created = Date.parse(String(p.criadoEm || p.criado_em || ""));
                if (Number.isFinite(created)) {
                    const ageMs = Date.now() - created;
                    if (ageMs > 12 * 60 * 60 * 1000) {
                        return null;
                    }
                }
            } catch {
            }

            return p;
        } catch {
            return null;
        }
    }

    async function enviarPedido() {
        if (state.carrinho.length === 0) return;

        if (state.sending) return;

        const pagamento_preferido = String(state.payMethod || "DINHEIRO").toUpperCase();

        const produtosMap = new Map((state.data?.produtos || []).map(p => [p.id, p]));
        const itens = state.carrinho.map(it => {
            const p = produtosMap.get(it.produtoId);
            const pdvCode = p && p.pdvCode ? String(p.pdvCode) : "";
            return {
                product_code: pdvCode || String(it.produtoId),
                nome: it.nome,
                qty: it.qtd
            };
        });

        const isSalao = Boolean(state.mesa && state.token);

        let payload;
        let url;
        if (isSalao) {
            payload = {
                mesa: state.mesa,
                token: state.token,
                cliente_nome: String(state.clientName || "").trim(),
                pagamento_preferido,
                itens,
                total_estimado: getCartTotal()
            };
            url = "/api/solicitacoes";
        } else {
            const nome = String(state.clientName || "").trim();
            const whatsapp = String(state.clientWhatsapp || "").trim();
            if (!nome) {
                setModal("Delivery / Retirada", `<div><strong>Informe o nome do cliente.</strong></div>`);
                abrirModal();
                return;
            }
            if (!whatsapp) {
                setModal("Delivery / Retirada", `<div><strong>Informe o WhatsApp do cliente.</strong></div>`);
                abrirModal();
                return;
            }

            const tipo_entrega = String(state.deliveryType || "DELIVERY").toUpperCase();
            const endereco = null;

            let troco_para = null;
            if (pagamento_preferido === "DINHEIRO") {
                const trocoRaw = String(state.deliveryTroco || "").trim();
                if (trocoRaw) {
                    const n = Number(trocoRaw.replace(",", "."));
                    if (!Number.isFinite(n) || n < 0) {
                        setModal("Delivery / Retirada", `<div><strong>Troco inválido.</strong></div>`);
                        abrirModal();
                        return;
                    }
                    troco_para = n;
                }
            }

            payload = {
                cliente_nome: nome,
                cliente_whatsapp: whatsapp,
                tipo_entrega: (tipo_entrega === "RETIRADA" ? "RETIRADA" : "DELIVERY"),
                endereco,
                troco_para,
                observacoes: null,
                pagamento_preferido,
                itens,
                total_estimado: getCartTotal()
            };
            url = "/api/public/pedidos";
        }

        let res;
        try {
            state.sending = true;
            abrirCarrinho();
            res = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
        } catch {
            state.sending = false;
            setModal("Erro", `<div><strong>Não foi possível enviar o pedido.</strong></div>`);
            abrirModal();
            return;
        }

        if (!res.ok) {
            state.sending = false;
            let j = {};
            try { j = await res.json(); } catch {}
            setModal("Erro", `<div><strong>Falha ao enviar:</strong> ${(j.error || "desconhecido")}</div>`);
            abrirModal();
            return;
        }

        const out = await res.json();
        const kind = isSalao ? "SALAO" : "DELIVERY";
        const pedido = {
            id: out.id,
            kind,
            mesa: isSalao ? state.mesa : null,
            token: isSalao ? state.token : null,
            access_token: (!isSalao && out.token) ? out.token : null,
            criadoEm: new Date().toISOString(),
            status: "PENDENTE",
            cliente_nome: String(state.clientName || "").trim(),
            cliente_whatsapp: !isSalao ? String(state.clientWhatsapp || "").trim() : null,
            tipo_entrega: !isSalao ? String(state.deliveryType || "DELIVERY").toUpperCase() : null,
            endereco: null,
            troco_para: !isSalao ? (String(state.deliveryTroco || "").trim() || null) : null,
            observacoes: null,
            pagamento_preferido,
            itens: state.carrinho.map(it => ({
                produtoId: it.produtoId,
                nome: it.nome,
                qtd: it.qtd,
                preco: it.preco
            })),
            total: getCartTotal()
        };

        savePedidoAtual(pedido);
        state.sending = false;
        state.carrinho = [];
        saveLocal();
        updateCartBadge();
        showPostOrderScreen();
    }

    function normalizeAnyAssetUrl(v) {
        const s = String(v || "").trim();
        if (!s) return "";
        const low = s.toLowerCase();
        if (low.startsWith("http://") || low.startsWith("https://")) return s;
        if (s.startsWith("/assets/")) return s;
        if (s.startsWith("assets/")) return "/" + s;
        if (s.startsWith("/")) return s;
        return "/assets/" + s;
    }

    async function refreshSolicitacao() {
        const pedido = getPedidoAtual();
        if (!pedido || !pedido.id) return;

        const kind = String(pedido.kind || "").toUpperCase();
        if (kind !== "DELIVERY") {
            if (!state.mesa || !state.token) return;
        }

        try {
            const url = (kind === "DELIVERY")
                ? `/api/public/pedidos/${encodeURIComponent(pedido.id)}?token=${encodeURIComponent(String(pedido.access_token || ""))}`
                : `/api/solicitacoes/${encodeURIComponent(pedido.id)}?mesa=${encodeURIComponent(state.mesa)}&token=${encodeURIComponent(state.token)}`;
            const res = await fetch(url, { cache: "no-store" });
            if (!res.ok) {
                // Se o pedido não existe mais (ou token inválido), limpa o estado local
                if (res.status === 404 || res.status === 401 || res.status === 403) {
                    clearPedidoAtual();
                    const backdrop = document.getElementById("modalBackdrop");
                    if (backdrop && backdrop.style.display === "flex") {
                        abrirCarrinho();
                    }
                }
                return;
            }
            const s = await res.json();
            pedido.status = s.status || pedido.status;
            pedido.pdv_id = s.pdv_id || pedido.pdv_id || null;
            pedido.sale_id = s.sale_id || pedido.sale_id || null;
            if (s.total_estimado !== undefined) pedido.total_estimado = s.total_estimado;
            pedido.atualizadoEm = new Date().toISOString();
            pedido.resposta = s.resposta || null;
            pedido.comprovante = s.comprovante || null;
            pedido.pdv_status = s.pdv_status || null;
            pedido.pdv_status_em = s.pdv_status_em || null;
            savePedidoAtual(pedido);

            const pdvStatus = String(pedido.pdv_status || "").toUpperCase();
            if (pdvStatus === "FINALIZADA") {
                clearPedidoAtual();
                if (isModalOpen()) {
                    setModal(
                        "Pedido encerrado",
                        `<div><strong>Seu pedido foi finalizado no PDV.</strong></div>`
                        + `<div class="muted" style="margin-top:8px">Você já pode fazer um novo pedido.</div>`
                        + `<div style="margin-top:14px"><button onclick="fecharModal()">OK</button></div>`
                    );
                    abrirModal();
                }
                return;
            }

            if (isModalOpen()) {
                // Evita re-render enquanto o cliente está escolhendo a forma de pagamento
                // (o select pode "fechar sozinho" se o modal for recriado pelo refresh)
                if (Date.now() < (state.modalLockUntil || 0)) return;
                const title = String(document.getElementById("modalTitle")?.innerText || "");
                if (title === "Carrinho / Pedido") {
                    if (!state.postOrderActive) {
                        abrirCarrinho();
                    }
                }
            }
        } catch {
        }
    }

    function renderLista() {
        const lista = document.getElementById("listaProdutos");
        if (!lista) return;
        const renderProduto = (p) => `
            <div class="product" data-nome="${(p.nome || "").toLowerCase()}">
                <img src="${p.imagem}" alt="${p.nome}">
                <div class="product-info">
                    <div class="product-title">${escapeHtml(p.nome || "")}</div>
                    ${(() => {
                        const raw = getProdutoDescricao(p);
                        const trimmed = raw.trim();
                        if (!trimmed) return "";
                        const nomeEnc = encodeURIComponent(String(p.nome || ""));
                        const descEnc = encodeURIComponent(String(raw || ""));
                        return `<button type="button" class="product-desc-btn" onclick="abrirDescricaoProdutoEncoded('${p.id}','${nomeEnc}','${descEnc}','${String(p.preco ?? "")}')">Descrição</button>`;
                    })()}
                    <div class="product-price">${formatBRL(p.preco)}</div>
                </div>
                <button type="button" class="add-btn" aria-disabled="${!p.ativo}" onclick="addCarrinho('${p.id}')">+1</button>
            </div>
        `;

        const produtosAll = (state.data.produtos || []).filter(p => {
            if (!p.ativo) return false;
            const nome = (p.nome || "").toLowerCase();
            const desc = getProdutoDescricao(p).toLowerCase();
            const matchBusca = !state.busca || nome.includes(state.busca) || desc.includes(state.busca);
            return matchBusca;
        });

        if (state.categoriaId !== "__todas__") {
            const produtos = produtosAll.filter(p => p.categoriaId === state.categoriaId);
            if (produtos.length === 0) {
                lista.innerHTML = `<div class="product"><div class="product-info"><strong>Nenhum produto encontrado.</strong><div class="muted">Tente ajustar a busca ou a categoria.</div></div></div>`;
                return;
            }
            lista.innerHTML = produtos.map(renderProduto).join("");
            return;
        }

        if (produtosAll.length === 0) {
            lista.innerHTML = `<div class="product"><div class="product-info"><strong>Nenhum produto encontrado.</strong><div class="muted">Tente ajustar a busca ou a categoria.</div></div></div>`;
            return;
        }

        const cats = Array.isArray(state.data?.categorias) ? state.data.categorias : [];
        const byCat = new Map();
        for (const p of produtosAll) {
            const cid = String(p.categoriaId || "");
            if (!byCat.has(cid)) byCat.set(cid, []);
            byCat.get(cid).push(p);
        }

        const seen = new Set();
        const chunks = [];
        for (const c of cats) {
            const cid = String(c?.id || "");
            const items = byCat.get(cid) || [];
            if (!cid || items.length === 0) continue;
            seen.add(cid);
            chunks.push(`<div class="section-title">${escapeHtml(humanCategoryName(String(c.nome || "")))}</div>`);
            chunks.push(items.map(renderProduto).join(""));
        }

        const leftovers = [];
        for (const [cid, items] of byCat.entries()) {
            if (!cid || seen.has(cid)) continue;
            leftovers.push(...items);
        }
        if (leftovers.length > 0) {
            chunks.push(`<div class="section-title">Produtos</div>`);
            chunks.push(leftovers.map(renderProduto).join(""));
        }

        lista.innerHTML = chunks.join("");
    }

    function escapeHtml(s) {
        return String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/\"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function getProdutoDescricao(p) {
        if (!p) return "";
        const candidates = [
            p.descricao,
            p.descrição,
            p.description,
            p.desc,
            p.obs,
            p.observacoes,
            p.observações
        ];
        for (const v of candidates) {
            const s = String(v || "");
            if (s.trim()) return s;
        }
        return "";
    }

    function abrirDescricaoProdutoEncoded(produtoId, nomeEnc, descEnc, precoRaw) {
        let nome = "";
        let descricao = "";
        let preco = 0;
        try {
            nome = decodeURIComponent(String(nomeEnc || ""));
        } catch {
            nome = String(nomeEnc || "");
        }
        try {
            descricao = decodeURIComponent(String(descEnc || ""));
        } catch {
            descricao = String(descEnc || "");
        }

        try {
            preco = Number(String(precoRaw || "").replace(",", "."));
            if (!Number.isFinite(preco)) preco = 0;
        } catch {
            preco = 0;
        }

        const n = escapeHtml(String(nome || ""));
        const raw = String(descricao || "").trim();
        const normalized = raw.replace(/\\n/g, "\n");
        const body = `
            ${normalized
                ? `<div style="white-space: pre-wrap; line-height: 1.35">${escapeHtml(normalized)}</div>`
                : `<div class="muted">Sem descrição.</div>`}
            <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; align-items:center">
                <button onclick="addCarrinho('${String(produtoId || "")}'); fecharModal();">+1</button>
                <div class="product-price" style="margin-top:0">${formatBRL(preco)}</div>
            </div>
        `;
        setModal(n || "Descrição", body);
        abrirModal();
    }

    function render() {
        if (!state.data) return;
        const cats = state.data?.categorias || [];
        if (state.categoriaId !== "__todas__" && !cats.some(c => c.id === state.categoriaId)) {
            state.categoriaId = "__todas__";
        }
        renderCategoriasRow();
        renderQueridinhos();
        renderLista();
    }

    function aplicarUI() {
        const logo = state.data?.ui?.logo;
        const whatsapp = state.data?.ui?.whatsapp;
        const logoImg = document.getElementById("logoImg");
        const brandText = document.getElementById("brandText");
        const whatsBtn = document.getElementById("whatsBtn");
        const whatsFloat = document.getElementById("whatsFloat");

        function normalizeAssetUrl(v) {
            const s = String(v || "").trim();
            if (!s) return "";
            const low = s.toLowerCase();
            if (low.startsWith("http://") || low.startsWith("https://")) return s;
            if (s.startsWith("/assets/")) return s;
            if (s.startsWith("assets/")) return "/" + s;
            if (s.startsWith("/")) return s;
            return "/assets/" + s;
        }

        if (logo) {
            logoImg.src = normalizeAssetUrl(logo);
            logoImg.style.display = "block";
            logoImg.onerror = () => {
                logoImg.style.display = "none";
            };
            brandText.style.display = "none";
        } else {
            logoImg.style.display = "none";
            brandText.style.display = "block";
        }

        try {
            const raw = String(whatsapp || "").trim();
            const digits = raw.replace(/\D+/g, "");
            if (digits.length >= 12) {
                const msg = encodeURIComponent("Olá! Vim pelo cardápio online.");
                const url = `https://wa.me/${digits}?text=${msg}`;
                if (whatsBtn) {
                    whatsBtn.href = url;
                    whatsBtn.style.display = "none";
                }
                if (whatsFloat) {
                    whatsFloat.href = url;
                    whatsFloat.style.display = "inline-flex";
                }
            } else {
                if (whatsBtn) whatsBtn.style.display = "none";
                if (whatsFloat) whatsFloat.style.display = "none";
            }
        } catch {
            if (whatsBtn) whatsBtn.style.display = "none";
            if (whatsFloat) whatsFloat.style.display = "none";
        }
    }

    function iniciarBanner() {
        const imagens = state.data?.ui?.banner?.imagens || [];
        const intervaloMs = state.data?.ui?.banner?.intervaloMs || 3500;
        const bannerImg = document.getElementById("bannerImg");
        const bannerFallback = document.getElementById("bannerFallback");

        function normalizeAssetUrl(v) {
            const s = String(v || "").trim();
            if (!s) return "";
            const low = s.toLowerCase();
            if (low.startsWith("http://") || low.startsWith("https://")) return s;
            if (s.startsWith("/assets/")) return s;
            if (s.startsWith("assets/")) return "/" + s;
            if (s.startsWith("/")) return s;
            return "/assets/" + s;
        }

        if (!Array.isArray(imagens) || imagens.length === 0) {
            bannerImg.style.display = "none";
            bannerFallback.style.display = "block";
            return;
        }

        const normalized = imagens.map(normalizeAssetUrl).filter(Boolean);
        if (normalized.length === 0) {
            bannerImg.style.display = "none";
            bannerFallback.style.display = "block";
            return;
        }

        // Evita reiniciar o banner a cada refresh se nada mudou
        const sig = `${intervaloMs}|${normalized.join("|")}`;
        if (state.bannerSig === sig && state.bannerTimer) {
            return;
        }
        state.bannerSig = sig;

        function setBannerAt(i) {
            const src = normalized[i % normalized.length];
            bannerImg.onerror = () => {
                // tenta próxima imagem; se todas falharem, mostra fallback
                let tries = 0;
                let j = (i + 1) % normalized.length;
                while (tries < normalized.length) {
                    const nextSrc = normalized[j % normalized.length];
                    if (nextSrc && nextSrc !== bannerImg.src) {
                        bannerImg.src = nextSrc;
                        return;
                    }
                    tries += 1;
                    j = (j + 1) % normalized.length;
                }
                bannerImg.style.display = "none";
                bannerFallback.style.display = "block";
            };
            bannerImg.src = src;
            bannerImg.style.display = "block";
            bannerFallback.style.display = "none";
        }

        if (state.bannerTimer) {
            clearInterval(state.bannerTimer);
            state.bannerTimer = null;
        }

        state.bannerIndex = 0;
        setBannerAt(state.bannerIndex);
        state.bannerTimer = setInterval(() => {
            state.bannerIndex = (state.bannerIndex + 1) % normalized.length;
            setBannerAt(state.bannerIndex);
        }, intervaloMs);
    }

    async function carregarDados() {
        const res = await fetch("/api/data", { cache: "no-store" });
        const status = res.status;
        const ct = String(res.headers.get("content-type") || "");
        let bodyText = "";
        try {
            bodyText = await res.text();
        } catch {
            bodyText = "";
        }

        if (!res.ok) {
            const msg = (bodyText || "").slice(0, 500);
            throw new Error(`api_data_http_${status}: ${msg}`);
        }

        if (ct.includes("application/json")) {
            try {
                return JSON.parse(bodyText || "{}");
            } catch {
                throw new Error("api_data_json_parse_error");
            }
        }

        // fallback
        try {
            return JSON.parse(bodyText || "{}");
        } catch {
            throw new Error("api_data_not_json");
        }
    }

    async function refreshCatalogo() {
        try {
            const novo = await carregarDados();
            state.data = novo;
            aplicarUI();
            iniciarBanner();
            aplicarHorarioFuncionamento();
            render();
        } catch {
        }
    }

    async function init() {
        const params = new URLSearchParams(window.location.search);
        state.admin = params.get("admin") === "1";
        document.getElementById("adminHint").style.display = state.admin ? "block" : "none";

        const mtUrl = getMesaTokenFromUrl();
        const mtLocal = getMesaTokenFromLocal();
        const mt = (mtUrl && mtUrl.mesa && mtUrl.token) ? mtUrl : mtLocal;
        state.mesa = mt.mesa;
        state.token = mt.token;
        if (mtUrl && mtUrl.mesa && mtUrl.token) {
            saveMesaTokenToLocal(mtUrl.mesa, mtUrl.token);
            clearMesaTokenFromUrl();
        }

        loadLocal();
        updateCartBadge();

        try {
            state.data = await carregarDados();
            aplicarUI();
            iniciarBanner();
            aplicarHorarioFuncionamento();
            render();

            try {
                const p = getPedidoAtual();
                if (p && state.carrinho.length === 0) {
                    showPostOrderScreen();
                } else {
                    showMainScreen();
                }
            } catch {
            }

            if (state.solicitacaoTimer) {
                clearInterval(state.solicitacaoTimer);
                state.solicitacaoTimer = null;
            }
            state.solicitacaoTimer = setInterval(async () => {
                await refreshSolicitacao();
            }, 2500);

            if (state.refreshTimer) {
                clearInterval(state.refreshTimer);
                state.refreshTimer = null;
            }
            state.refreshTimer = setInterval(refreshCatalogo, 5000);

            if (state.horarioTimer) {
                clearInterval(state.horarioTimer);
                state.horarioTimer = null;
            }
            state.horarioTimer = setInterval(aplicarHorarioFuncionamento, 30000);
        } catch (e) {
            try { console.error(e); } catch {}
            const msg = (e && e.message) ? String(e.message) : String(e || "erro");
            setModal(
                "Erro ao carregar produtos",
                `<div><strong>Não foi possível carregar os dados do cardápio.</strong></div>`
                + `<div class="muted" style="margin-top:10px">Detalhe: ${escapeHtml(msg)}</div>`
            );
            abrirModal();
        }
    }

    window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") fecharModal();
    });

    init();
</script>
